# Démarrage local ou déploiement simple : `docker compose up -d`.
# Les identifiants SMTP sont optionnels - sans eux, les e-mails (invitation, mot de passe oublié)
# ne sont pas envoyés : seuls leur destinataire et leur objet sont journalisés (le corps, avec son
# lien, seulement si SPECTRE_EMAIL_DEBUG=1 ; voir spectre/kernel/mail.py).
services:
  spectre:
    # image chargée depuis le .tar (docker load) ; build: . seulement si elle n'existe pas (poste de dev)
    image: spectre:latest
    build: .
    ports:
      - "8000:8000"
    # Mot de passe PRISM (PRISM_USER / PRISM_PASSWORD) : le .env à côté de ce fichier, absent = ignoré.
    env_file:
      - path: .env
        required: false
    environment:
      # URL publique (variable SPECTRE_BASE_URL du .env, sinon localhost) utilisée dans les liens des e-mails envoyés (invitation, réinitialisation).
      SPECTRE_BASE_URL: "${SPECTRE_BASE_URL:-http://localhost:8000}"
      # Décommenter et renseigner pour envoyer réellement les e-mails :
      # SPECTRE_SMTP_HOST: "smtp.example.com"
      # SPECTRE_SMTP_PORT: "587"
      # SPECTRE_SMTP_USER: "spectre@example.com"
      # SPECTRE_SMTP_PASSWORD: "changeme"
      # SPECTRE_SMTP_FROM: "spectre@example.com"
    volumes:
      # les données (base, dépôts, pièces jointes) dans un dossier à côté de ce fichier. Sous Linux, il doit
      # appartenir à l'UID 1000 du conteneur : sudo chown 1000:1000 data_spectre_docker
      - ./data_spectre_docker:/data
    restart: unless-stopped
