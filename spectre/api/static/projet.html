<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projet — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
      </span>
      Spectre
      <span class="topbar__crumb" id="crumb"></span>
    </div>
    <div class="topbar__actions">
      <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
      <div class="avatar js-user-initials"></div>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page">
    <p style="color:var(--text-faint);margin-bottom:8px;"><a href="/">&larr; Mes projets</a></p>

    <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>

    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 id="project-name" style="font-size:22px;"></h1>
        <p id="project-description" style="color:var(--text-soft);font-size:14px;margin-top:4px;"></p>
      </div>
      <div style="display:flex;gap:10px;">
        <a id="graph-link" href="#" class="btn btn-line">Vue d'ensemble</a>
        <button id="new-structure-btn" class="btn btn-primary" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nouvelle structure
        </button>
      </div>
    </div>

    <div class="tabs" style="margin-bottom:24px;">
      <button class="tab active" data-tab="running">En cours</button>
      <button class="tab" data-tab="concluded">Terminées</button>
      <button class="tab" data-tab="members">Membres</button>
    </div>

    <div id="tab-running" class="tab-panel">
      <div id="running-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
    </div>

    <div id="tab-concluded" class="tab-panel" style="display:none;">
      <div id="concluded-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
    </div>

    <div id="tab-members" class="tab-panel" style="display:none;">
      <div class="card card-pad" style="max-width:640px;">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px;" id="members-table">
          <thead>
            <tr style="text-align:left;color:var(--text-faint);font-size:12px;text-transform:uppercase;letter-spacing:.03em;">
              <th style="padding-bottom:10px;">Personne</th>
              <th style="padding-bottom:10px;">Droit</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="members-body"></tbody>
        </table>

        <form id="add-member-form" style="display:none;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);gap:10px;" class="field-row" style="grid-template-columns:1fr 140px auto;">
          <input class="field" id="member-email" type="email" placeholder="e-mail de la personne" required>
          <select class="field" id="member-role">
            <option value="viewer">Lecture seule</option>
            <option value="editor" selected>Peut modifier</option>
            <option value="owner">Propriétaire</option>
          </select>
          <button class="btn btn-primary" type="submit">Ajouter</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    const slug = window.location.pathname.split("/")[2];
    const errorBox = document.getElementById("error");
    let currentUser = null;
    let currentRole = null;

    function showError(err) {
      errorBox.textContent = err.message || String(err);
      errorBox.style.display = "block";
    }

    function experienceCard(exp) {
      return `
        <a href="/projets/${encodeURIComponent(slug)}/experiences/${encodeURIComponent(exp.id)}" class="card card-pad" style="display:flex;flex-direction:column;gap:12px;color:inherit;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;">
            ${statusBadgeHtml(exp.status)}
            <span class="mono" style="font-size:11px;color:var(--text-faint);">${escapeHtml(exp.id.slice(0, 10))}</span>
          </div>
          <div>
            <div style="font-size:15.5px;font-weight:700;line-height:1.35;">${escapeHtml(exp.title)}</div>
            <div style="color:var(--text-soft);font-size:13px;margin-top:5px;line-height:1.5;">${escapeHtml(exp.intent)}</div>
          </div>
          <div style="font-size:12.5px;color:var(--text-soft);padding-top:8px;border-top:1px solid var(--border-soft);">
            ${escapeHtml(exp.author || "Auteur inconnu")} &middot; ${timeAgo(exp.created_at)}
          </div>
        </a>`;
    }

    function emptyState(message) {
      return `<div class="empty-state card" style="grid-column:1/-1;">${escapeHtml(message)}</div>`;
    }

    async function loadExperiences(status, targetEl, emptyMessage) {
      try {
        const data = await api.get(`/api/projects/${encodeURIComponent(slug)}/experiences?status=${status}`);
        targetEl.innerHTML = data.items.length ? data.items.map(experienceCard).join("") : emptyState(emptyMessage);
      } catch (err) {
        showError(err);
      }
    }

    function memberRow(member) {
      const canManage = currentRole === "owner";
      return `
        <tr style="border-top:1px solid var(--border-soft);">
          <td style="padding:10px 0;">
            <div style="font-weight:600;">${escapeHtml(member.name)}</div>
            <div style="color:var(--text-faint);font-size:12px;">${escapeHtml(member.email)}</div>
          </td>
          <td><span class="badge badge-role">${escapeHtml(roleLabel(member.role))}</span></td>
          <td style="text-align:right;">
            ${canManage ? `<button class="btn btn-line js-remove-member" data-user-id="${member.id}" style="padding:5px 10px;font-size:12px;">Retirer</button>` : ""}
          </td>
        </tr>`;
    }

    async function loadMembers() {
      try {
        const members = await api.get(`/api/projects/${encodeURIComponent(slug)}/members`);
        document.getElementById("members-body").innerHTML = members.map(memberRow).join("");
        document.querySelectorAll(".js-remove-member").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              await api.del(`/api/projects/${encodeURIComponent(slug)}/members/${btn.dataset.userId}`);
              loadMembers();
            } catch (err) {
              showError(err);
            }
          });
        });
      } catch (err) {
        showError(err);
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => (p.style.display = "none"));
        tab.classList.add("active");
        document.getElementById(`tab-${tab.dataset.tab}`).style.display = "";
      });
    });

    document.getElementById("add-member-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("member-email").value;
      const role = document.getElementById("member-role").value;
      try {
        await api.post(`/api/projects/${encodeURIComponent(slug)}/members`, { email, role });
        document.getElementById("member-email").value = "";
        loadMembers();
      } catch (err) {
        showError(err);
      }
    });

    async function init() {
      try {
        const project = await api.get(`/api/projects/${encodeURIComponent(slug)}`);
        currentRole = project.role;
        document.getElementById("project-name").textContent = project.name;
        document.getElementById("project-description").textContent = project.description;
        document.getElementById("crumb").textContent = "/ " + project.name;
        document.getElementById("graph-link").href = `/projets/${encodeURIComponent(slug)}/graphe`;

        if (currentRole === "editor" || currentRole === "owner") {
          document.getElementById("new-structure-btn").style.display = "";
          document.getElementById("new-structure-btn").addEventListener("click", () => {
            window.location.href = `/projets/${encodeURIComponent(slug)}/structures/nouvelle`;
          });
        }
        if (currentRole === "owner") {
          document.getElementById("add-member-form").style.display = "grid";
        }
      } catch (err) {
        showError(err);
        return;
      }

      loadExperiences("running", document.getElementById("running-list"), "Aucune expérience en cours pour l'instant.");
      loadExperiences("concluded", document.getElementById("concluded-list"), "Aucune expérience terminée pour l'instant.");
      loadMembers();
    }

    init();
  </script>
</body>
</html>
