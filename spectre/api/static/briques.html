<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Briques technologiques — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="topbar">
    <a href="/" style="display:flex;align-items:center;">
      <div class="topbar__brand">
        <span class="topbar__mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
        </span>
        Spectre
        <span class="topbar__crumb" id="crumb"></span>
      </div>
    </a>
    <div class="topbar__actions">
      <a href="/docs" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Documentation</a>
      <a href="/profil" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
        <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
        <div class="avatar js-user-initials"></div>
      </a>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page" style="max-width:960px;">
    <p style="color:var(--text-faint);margin-bottom:8px;"><a id="back-link" href="#">&larr; Retour au projet</a></p>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <h1 style="font-size:22px;">Briques technologiques</h1>
      <a class="btn btn-primary" id="new-brick-link" href="#" style="padding:8px 14px;font-size:13px;">+ Nouvelle brique</a>
    </div>
    <p style="color:var(--text-soft);font-size:14px;margin-bottom:20px;">Des séquences d'étapes préenregistrées (ex : un masque + une gravure standard, un empilement de croissance) à insérer d'un coup dans une structure, depuis le constructeur.</p>

    <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>
    <div id="flash" class="flash flash-ok" style="display:none;margin-bottom:16px;"></div>

    <div class="card card-pad">
      <div class="section-title" style="margin-bottom:12px;">Briques disponibles</div>
      <div id="bricks-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/briques.js"></script>
</body>
</html>
