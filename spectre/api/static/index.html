<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes projets — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
      </span>
      Spectre
    </div>
    <div class="topbar__actions">
      <a href="/docs" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Documentation</a>
      <a href="/profil" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
        <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
        <div class="avatar js-user-initials"></div>
      </a>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;">
      <div>
        <h1 style="font-size:22px;">Mes projets</h1>
        <p style="color:var(--text-soft);font-size:14px;margin-top:4px;">Les études de suivi d'expériences auxquelles vous participez.</p>
      </div>
      <button id="new-project-btn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nouveau projet
      </button>
    </div>

    <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>
    <div id="projects" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
  </div>

  <dialog id="new-project-dialog" style="border:none;border-radius:14px;padding:0;box-shadow:var(--shadow);">
    <div class="card-pad" style="width:340px;">
      <h2 style="font-size:16px;margin-bottom:14px;">Nouveau projet</h2>
      <form id="new-project-form" class="field-group">
        <div>
          <label for="project-name">Nom du projet</label>
          <input class="field" id="project-name" required>
        </div>
        <div>
          <label for="project-description">Description (optionnelle)</label>
          <textarea class="field" id="project-description" rows="2"></textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button type="button" id="cancel-project" class="btn btn-line btn-block">Annuler</button>
          <button type="submit" class="btn btn-primary btn-block">Créer</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    const projectsEl = document.getElementById("projects");
    const errorBox = document.getElementById("error");
    const dialog = document.getElementById("new-project-dialog");

    function projectCard(project) {
      return `
        <a href="/projets/${encodeURIComponent(project.slug)}" class="card card-pad" style="display:flex;flex-direction:column;gap:10px;color:inherit;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="font-size:15.5px;font-weight:700;">${escapeHtml(project.name)}</div>
            <span class="badge badge-role">${escapeHtml(roleLabel(project.role))}</span>
          </div>
          <div style="font-size:13px;color:var(--text-soft);min-height:18px;">${escapeHtml(project.description || "")}</div>
          <div style="font-size:12.5px;color:var(--text-faint);padding-top:8px;border-top:1px solid var(--border-soft);">
            ${project.running_count} en cours &middot; ${project.concluded_count} terminées
          </div>
        </a>`;
    }

    async function loadProjects() {
      try {
        const projects = await api.get("/api/projects");
        if (projects.length === 0) {
          projectsEl.innerHTML = `
            <div class="empty-state card" style="grid-column:1/-1;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
              <div style="font-weight:600;color:var(--text-soft);">Vous ne participez à aucun projet pour l'instant</div>
              <div style="font-size:13px;">Créez-en un pour commencer à suivre vos expériences.</div>
            </div>`;
          return;
        }
        projectsEl.innerHTML = projects.map(projectCard).join("");
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    }

    document.getElementById("new-project-btn").addEventListener("click", () => dialog.showModal());
    document.getElementById("cancel-project").addEventListener("click", () => dialog.close());

    document.getElementById("new-project-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = document.getElementById("project-name").value;
      const description = document.getElementById("project-description").value;
      try {
        const project = await api.post("/api/projects", { name, description });
        window.location.href = `/projets/${encodeURIComponent(project.slug)}`;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
        dialog.close();
      }
    });

    loadProjects();
  </script>
</body>
</html>
