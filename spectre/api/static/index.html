<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thèmes — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <style>
    .theme-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:22px; max-width:1000px; margin:0 auto; }
    .theme-card {
      display:flex; flex-direction:column; gap:14px; color:inherit; text-decoration:none;
      padding:26px 24px; border-radius:var(--radius); border:1px solid var(--border-soft);
      background:var(--surface); transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .theme-card:hover { border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-2px); }
    .theme-card__name { font-size:19px; font-weight:700; }
    .theme-card__stats { display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--text-faint); padding-top:12px; border-top:1px solid var(--border-soft); }
    .theme-card__stats strong { color:var(--text); font-size:14px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" style="display:flex;align-items:center;">
    <div class="topbar__brand">
      <span class="topbar__mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
      </span>
      Spectre
    </div>
    </a>
    <div class="topbar__actions">
      <a href="/pilotage" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Pilotage</a>
      <a href="/bibliotheque" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Bibliothèque</a>
      <a href="/docs" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Documentation</a>
      <a href="/profil" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
        <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
        <div class="avatar js-user-initials"></div>
      </a>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page" style="padding-top:44px;">
    <div style="text-align:center;max-width:640px;margin:0 auto 34px;">
      <h1 style="font-size:26px;">Thèmes</h1>
      <p style="color:var(--text-soft);font-size:14.5px;margin-top:8px;">Les grands thèmes que la société pilote. Entrez dans un thème pour voir les µprojets qui l'adressent.</p>
      <button id="new-theme-btn" class="btn btn-line" style="display:none;margin-top:14px;">+ Nouveau thème</button>
    </div>

    <div id="error" class="error" style="display:none;margin:0 auto 20px;max-width:1000px;"></div>

    <div id="themes" class="theme-grid"></div>

    <details id="my-microprojects-details" style="max-width:1000px;margin:56px auto 0;">
      <summary style="cursor:pointer;color:var(--text-faint);font-size:13px;list-style:none;">
        <span style="border-bottom:1px dashed var(--border);">Mes µprojets <span id="my-microprojects-count"></span></span>
      </summary>
      <div style="font-size:12px;color:var(--text-faint);margin:8px 0 14px;">Accès direct aux µprojets dont vous êtes membre.</div>
      <div id="my-microprojects" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;"></div>
    </details>
  </div>

  <dialog id="new-theme-dialog" style="border:none;border-radius:14px;padding:0;box-shadow:var(--shadow);">
    <div class="card-pad" style="width:380px;">
      <h2 style="font-size:16px;margin-bottom:14px;">Nouveau thème</h2>
      <form id="new-theme-form" class="field-group">
        <div><label for="theme-name">Nom du thème</label><input class="field" id="theme-name" required placeholder="ex : Fiabilité produit"></div>
        <div><label for="theme-description">Description (optionnelle)</label><textarea class="field" id="theme-description" rows="2"></textarea></div>
        <div><label for="theme-strategy">Objectif stratégique (optionnel)</label><textarea class="field" id="theme-strategy" rows="2" placeholder="Ce que ce thème doit faire avancer"></textarea></div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button type="button" id="cancel-theme" class="btn btn-line btn-block">Annuler</button>
          <button type="submit" class="btn btn-primary btn-block">Créer</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/themes.js"></script>
</body>
</html>
