<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="topbar__mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
        </span>
        Spectre
      </div>

      <div class="card card-pad">
        <h1 style="font-size:20px;margin-bottom:4px;">Connexion</h1>
        <p style="color:var(--text-soft);font-size:13.5px;margin-bottom:20px;">Accédez à vos projets de suivi d'expériences.</p>

        <div id="error" class="error" style="display:none;margin-bottom:14px;"></div>

        <form id="login-form" class="field-group">
          <div>
            <label for="email">Adresse e-mail</label>
            <input class="field" type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div>
            <label for="password">Mot de passe</label>
            <input class="field" type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:8px;">Se connecter</button>
        </form>
        <div style="text-align:center;margin-top:12px;"><a href="/mot-de-passe-oublie" style="font-size:12.5px;">Mot de passe oublié ?</a></div>
      </div>

      <div class="auth-switch">Pas encore de compte ? <a href="/inscription">Créer un compte</a></div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");

    function suiteUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("suite") || "/";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.style.display = "none";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await api.post("/api/auth/login", { email, password }, { redirectOn401: false });
        window.location.href = suiteUrl();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
