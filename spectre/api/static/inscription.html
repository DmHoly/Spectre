<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un compte — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="topbar__mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
        </span>
        Spectre
      </div>

      <div class="card card-pad">
        <h1 style="font-size:20px;margin-bottom:4px;">Créer un compte</h1>
        <p id="subtitle" style="color:var(--text-soft);font-size:13.5px;margin-bottom:20px;">Pour rejoindre un projet, demandez d'abord une invitation à son responsable.</p>

        <div id="error" class="error" style="display:none;margin-bottom:14px;"></div>
        <div id="invitation-note" class="flash flash-ok" style="display:none;margin-bottom:14px;"></div>

        <form id="register-form" class="field-group">
          <div>
            <label for="name">Nom complet</label>
            <input class="field" type="text" id="name" name="name" required autocomplete="name">
          </div>
          <div>
            <label for="email">Adresse e-mail</label>
            <input class="field" type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div>
            <label for="password">Mot de passe</label>
            <input class="field" type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
            <div class="help">8 caractères minimum.</div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:8px;">Créer mon compte</button>
        </form>
      </div>

      <div class="auth-switch">Déjà un compte ? <a href="/connexion">Se connecter</a></div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error");
    const invitationToken = new URLSearchParams(window.location.search).get("invitation");

    async function loadInvitation() {
      if (!invitationToken) return;
      try {
        const invitation = await api.get(`/api/auth/invitation/${invitationToken}`, { redirectOn401: false });
        document.getElementById("subtitle").textContent = `Vous rejoignez le projet « ${invitation.project_name} ».`;
        const emailField = document.getElementById("email");
        emailField.value = invitation.email;
        emailField.readOnly = true;
      } catch (err) {
        document.getElementById("invitation-note").className = "error";
        document.getElementById("invitation-note").textContent = "Ce lien d'invitation est invalide ou a expiré - vous pouvez tout de même créer un compte.";
        document.getElementById("invitation-note").style.display = "block";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.style.display = "none";
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await api.post(
          "/api/auth/register",
          { name, email, password, invitation: invitationToken || null },
          { redirectOn401: false }
        );
        window.location.href = "/";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });

    loadInvitation();
  </script>
</body>
</html>
