<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plaque — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="topbar">
    <div class="topbar__brand">
      <a href="/" class="topbar__home" aria-label="Spectre - accueil">
        <img class="brand-logo" src="/static/img/aledia-logo.svg" alt="Aledia" width="71" height="28">
        <span class="topbar__sep" aria-hidden="true"></span>
        <span class="topbar__product">Spectre</span>
      </a>
      <span class="topbar__crumb" id="crumb"></span>
    </div>
    <nav class="topbar__nav" aria-label="Navigation principale">
      <a href="/" class="topbar__link">Projets</a>
      <a href="/bibliotheque" class="topbar__link">Bibliothèque</a>
      <a href="/lots" class="topbar__link">Lots</a>
      <a href="/donnees" class="topbar__link">Data</a>
      <a href="/docs" class="topbar__link">Documentation</a>
    </nav>
    <div class="topbar__actions">
      <a href="/profil" class="topbar__user" title="Mon profil">
        <span class="js-user-name topbar__user-name"></span>
        <span class="avatar js-user-initials" aria-hidden="true"></span>
      </a>
      <a href="#" class="js-logout topbar__icon-btn" aria-label="Se déconnecter" title="Se déconnecter"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></a>
    </div>
  </div>

  <!-- La page d'une plaque (un wafer, par son lasermark) : où elle est, ses FDL, et toutes les
       études qui la suivent, d'un µprojet à l'autre - le « passeport » de la plaque, pour la
       traçabilité. Tout vient de GET /api/plaques/{lasermark} (spectre.core.plates). -->
  <div class="page" style="max-width:1080px;">
    <p style="color:var(--text-faint);margin-bottom:16px;"><a href="/">Projets</a> / Plaques / <span id="plate-crumb"></span></p>
    <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>

    <header class="card plate-hero" id="plate-hero">
      <div class="plate-hero__main">
        <div class="page-eyebrow">Plaque</div>
        <h1 class="plate-hero__lasermark" id="plate-lasermark"></h1>
        <p class="plate-hero__summary" id="plate-summary"></p>
      </div>
      <dl class="plate-hero__facts">
        <div><dt>Dernier emplacement connu</dt><dd id="plate-location">—</dd></div>
        <div><dt>FDL</dt><dd id="plate-fdl">—</dd></div>
        <div><dt style="text-transform:none;letter-spacing:0.04em;">µprojets</dt><dd id="plate-microprojects">—</dd></div>
        <div><dt>Lot</dt><dd id="plate-lots">—</dd></div>
      </dl>
      <div class="plate-hero__actions js-db-link"></div>
    </header>

    <section aria-labelledby="plate-trail-title">
      <h2 class="section-title" id="plate-trail-title" style="margin:22px 0 10px;">Parcours - les études qui la suivent</h2>
      <ol class="plate-trail" id="plate-trail"></ol>
    </section>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/plaque.js"></script>
</body>
</html>
