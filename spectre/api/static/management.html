<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thème — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="topbar">
    <a href="/" style="display:flex;align-items:center;">
      <div class="topbar__brand">
        <span class="topbar__mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
        </span>
        Spectre
        <span class="topbar__crumb" id="crumb"></span>
      </div>
    </a>
    <div class="topbar__actions">
      <a href="/pilotage" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Pilotage</a>
      <a href="/bibliotheque" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Bibliothèque</a>
      <a href="/docs" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Documentation</a>
      <a href="/profil" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
        <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
        <div class="avatar js-user-initials"></div>
      </a>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page">
    <p style="color:var(--text-faint);margin-bottom:8px;"><a href="/">Thèmes</a> / <span id="area-name-crumb">…</span></p>

    <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>
    <div id="flash" class="flash flash-ok" style="display:none;margin-bottom:16px;"></div>

    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px;">
      <div>
        <h1 id="area-name" style="font-size:22px;"></h1>
        <p id="area-description" style="color:var(--text-soft);font-size:14px;margin-top:4px;max-width:70ch;"></p>
      </div>
      <div style="display:flex;gap:10px;flex:none;">
        <button id="edit-area-btn" class="btn btn-line" style="display:none;">Modifier</button>
        <button id="new-microprojet-btn" class="btn btn-primary">+ Nouveau µprojet</button>
      </div>
    </div>
    <div id="area-strategy" class="card card-pad" style="display:none;background:var(--bg);margin:12px 0 4px;font-size:13px;"></div>

    <div id="area-kpi" style="display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 26px;padding:14px 18px;border:1px solid var(--border-soft);border-radius:var(--radius);"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <h2 style="font-size:16px;">µprojets de ce thème</h2>
      <button id="attach-microprojet-btn" class="btn btn-line" style="display:none;padding:5px 10px;font-size:12px;">Rattacher un µprojet existant</button>
    </div>
    <div id="microprojets" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
  </div>

  <dialog id="microprojet-dialog" style="border:none;border-radius:14px;padding:0;box-shadow:var(--shadow);">
    <div class="card-pad" style="width:360px;">
      <h2 style="font-size:16px;margin-bottom:14px;">Nouveau µprojet dans ce thème</h2>
      <form id="microprojet-form" class="field-group">
        <div><label for="mp-name">Nom du µprojet</label><input class="field" id="mp-name" required></div>
        <div><label for="mp-description">Description (optionnelle)</label><textarea class="field" id="mp-description" rows="2"></textarea></div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button type="button" id="mp-cancel" class="btn btn-line btn-block">Annuler</button>
          <button type="submit" class="btn btn-primary btn-block">Créer</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="edit-area-dialog" style="border:none;border-radius:14px;padding:0;box-shadow:var(--shadow);">
    <div class="card-pad" style="width:400px;">
      <h2 style="font-size:16px;margin-bottom:14px;">Modifier le thème</h2>
      <form id="edit-area-form" class="field-group">
        <div><label for="ea-name">Nom</label><input class="field" id="ea-name" required></div>
        <div><label for="ea-description">Description</label><textarea class="field" id="ea-description" rows="2"></textarea></div>
        <div><label for="ea-strategy">Objectif stratégique</label><textarea class="field" id="ea-strategy" rows="2"></textarea></div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button type="button" id="ea-cancel" class="btn btn-line btn-block">Annuler</button>
          <button type="submit" class="btn btn-primary btn-block">Enregistrer</button>
        </div>
        <button type="button" id="ea-delete" class="btn btn-danger btn-block" style="display:none;margin-top:4px;">Supprimer ce thème</button>
      </form>
    </div>
  </dialog>

  <dialog id="attach-dialog" style="border:none;border-radius:14px;padding:0;box-shadow:var(--shadow);">
    <div class="card-pad" style="width:400px;">
      <h2 style="font-size:16px;margin-bottom:6px;">Rattacher un µprojet à ce thème</h2>
      <p class="help" style="margin-bottom:12px;">Le µprojet quitte son thème actuel pour celui-ci.</p>
      <select class="field" id="attach-select" style="margin-bottom:12px;"></select>
      <div style="display:flex;gap:10px;">
        <button type="button" id="attach-cancel" class="btn btn-line btn-block">Annuler</button>
        <button type="button" id="attach-confirm" class="btn btn-primary btn-block">Rattacher</button>
      </div>
    </div>
  </dialog>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/management.js"></script>
</body>
</html>
