<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue d'ensemble — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="topbar">
    <div class="topbar__brand">
      <a href="/" class="topbar__home" aria-label="Spectre - accueil">
        <img class="brand-logo" src="/static/img/aledia-logo.svg" alt="Aledia" width="71" height="28">
        <span class="topbar__sep" aria-hidden="true"></span>
        <span class="topbar__product">Spectre</span>
      </a>
      <span class="topbar__crumb" id="crumb"></span>
    </div>
    <nav class="topbar__nav" aria-label="Navigation principale">
      <a href="/" class="topbar__link">Projets</a>
      <a href="/pilotage" class="topbar__link">Pilotage</a>
      <a href="/bibliotheque" class="topbar__link">Bibliothèque</a>
      <a href="/donnees" class="topbar__link">Data</a>
      <a href="/docs" class="topbar__link">Documentation</a>
    </nav>
    <div class="topbar__actions">
      <a href="/profil" class="topbar__user" title="Mon profil">
        <span class="js-user-name topbar__user-name"></span>
        <span class="avatar js-user-initials" aria-hidden="true"></span>
      </a>
      <a href="#" class="js-logout topbar__icon-btn" aria-label="Se déconnecter" title="Se déconnecter"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></a>
    </div>
  </div>

  <div class="page" style="max-width:1180px;">
    <p style="color:var(--text-faint);margin-bottom:8px;"><a id="microproject-link" href="/">&larr; Retour au µprojet</a></p>
    <h1 style="font-size:20px;margin-bottom:6px;">Vue d'ensemble</h1>
    <p style="color:var(--text-soft);font-size:13.5px;margin-bottom:20px;max-width:60ch;">
      Comment les versions des expériences de ce µprojet se relient entre elles : chaque point est une version, chaque trait un lien de filiation. Survolez un point pour le détail.
    </p>

    <div class="card" style="overflow:hidden;">
      <iframe id="graph-frame" style="width:100%;height:75vh;border:none;display:block;"></iframe>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    const slug = window.location.pathname.split("/").filter(Boolean)[1];
    document.getElementById("crumb").textContent = "/ " + slug;
    document.getElementById("microproject-link").href = `/microprojets/${slug}`;
    document.getElementById("graph-frame").src = `/api/microprojets/${slug}/graphe.html`;
  </script>
</body>
</html>
