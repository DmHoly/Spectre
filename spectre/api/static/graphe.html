<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue d'ensemble — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
      </span>
      Spectre
      <span class="topbar__crumb" id="crumb"></span>
    </div>
    <div class="topbar__actions">
      <a href="/profil" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
        <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
        <div class="avatar js-user-initials"></div>
      </a>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page" style="max-width:1180px;">
    <p style="color:var(--text-faint);margin-bottom:8px;"><a id="project-link" href="/">&larr; Retour au projet</a></p>
    <h1 style="font-size:20px;margin-bottom:6px;">Vue d'ensemble</h1>
    <p style="color:var(--text-soft);font-size:13.5px;margin-bottom:20px;max-width:60ch;">
      Comment les versions des expériences de ce projet se relient entre elles : chaque point est une version, chaque trait un lien de filiation. Survolez un point pour le détail.
    </p>

    <div class="card" style="overflow:hidden;">
      <iframe id="graph-frame" style="width:100%;height:75vh;border:none;display:block;"></iframe>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    const slug = window.location.pathname.split("/").filter(Boolean)[1];
    document.getElementById("crumb").textContent = "/ " + slug;
    document.getElementById("project-link").href = `/projets/${slug}`;
    document.getElementById("graph-frame").src = `/api/projects/${slug}/graphe.html`;
  </script>
</body>
</html>
