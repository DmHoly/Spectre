<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil — Spectre</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div class="topbar">
    <a href="/" style="display:flex;align-items:center;">
    <div class="topbar__brand">
      <span class="topbar__mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 19V9l8-5 8 5v10"/><path d="M9 19v-6h6v6"/></svg>
      </span>
      Spectre
    </div>
    </a>
    <div class="topbar__actions">
      <a href="/docs" class="btn btn-line" style="padding:6px 12px;font-size:12.5px;">Documentation</a>
      <a href="/profil" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
        <span class="js-user-name" style="font-size:13.5px;color:var(--text-soft);"></span>
        <div class="avatar js-user-initials"></div>
      </a>
      <a href="#" class="js-logout btn btn-line" style="padding:6px 12px;font-size:12.5px;">Se déconnecter</a>
    </div>
  </div>

  <div class="page" style="max-width:520px;">
    <p style="color:var(--text-faint);margin-bottom:16px;"><a href="/">&larr; Mes projets</a></p>
    <h1 style="font-size:22px;margin-bottom:20px;">Mon profil</h1>

    <div class="card card-pad" style="margin-bottom:20px;">
      <div class="section-title" style="margin-bottom:14px;">Identité</div>
      <div id="profile-error" class="error" style="display:none;margin-bottom:12px;"></div>
      <div id="profile-success" class="flash flash-ok" style="display:none;margin-bottom:12px;">Nom mis à jour.</div>
      <form id="profile-form" class="field-group">
        <div><label>Nom complet</label><input class="field" id="profile-name" required></div>
        <div><label>Adresse e-mail</label><input class="field" id="profile-email" disabled></div>
        <button class="btn btn-primary" type="submit" style="align-self:flex-start;">Enregistrer</button>
      </form>
    </div>

    <div class="card card-pad">
      <div class="section-title" style="margin-bottom:14px;">Mot de passe</div>
      <div id="password-error" class="error" style="display:none;margin-bottom:12px;"></div>
      <form id="password-form" class="field-group">
        <div><label>Mot de passe actuel</label><input class="field" type="password" id="current-password" required autocomplete="current-password"></div>
        <div><label>Nouveau mot de passe</label><input class="field" type="password" id="new-password" required autocomplete="new-password" minlength="8">
          <div class="help">8 caractères minimum. Vous serez déconnecté(e) de tous vos appareils.</div>
        </div>
        <button class="btn btn-line" type="submit" style="align-self:flex-start;">Changer le mot de passe</button>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    const profileError = document.getElementById("profile-error");
    const profileSuccess = document.getElementById("profile-success");
    const passwordError = document.getElementById("password-error");

    async function loadProfile() {
      try {
        const user = await api.get("/api/auth/me");
        document.getElementById("profile-name").value = user.name;
        document.getElementById("profile-email").value = user.email;
      } catch (err) {
        profileError.textContent = err.message;
        profileError.style.display = "block";
      }
    }

    document.getElementById("profile-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      profileError.style.display = "none";
      profileSuccess.style.display = "none";
      try {
        await api.request("/api/auth/me", { method: "PUT", body: { name: document.getElementById("profile-name").value } });
        profileSuccess.style.display = "block";
        mountUserBadge();
      } catch (err) {
        profileError.textContent = err.message;
        profileError.style.display = "block";
      }
    });

    document.getElementById("password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      passwordError.style.display = "none";
      try {
        await api.post("/api/auth/mot-de-passe", {
          current_password: document.getElementById("current-password").value,
          new_password: document.getElementById("new-password").value,
        });
        window.location.href = "/connexion";
      } catch (err) {
        passwordError.textContent = err.message;
        passwordError.style.display = "block";
      }
    });

    loadProfile();
  </script>
</body>
</html>
