title: "Photoluminescence (PL)"
description: >
  Mesures de photoluminescence par point sur wafer (longueur d'onde dominante/pic, largeur à
  mi-hauteur, intensité intégrée), filtrées sur les trois recettes de mesure standard 200mm
  (OD1.5/OD1/DUV) et sur les points dont la longueur d'onde dominante est exploitable (> 0).
  Une ligne = un point de mesure (X, Y) sur un wafer donné.
parameters:
  - wafer_names
postprocessing:
  - common:add_median_per_wafer
