title: "Photoluminescence (PL)"
category: "Post EPI"
description: >
  Mesures de photoluminescence par point sur wafer (longueur d'onde dominante/pic, largeur à
  mi-hauteur, intensité intégrée), limitées à la plage de longueur d'onde exploitable (440-700 nm).
  Ne garde que la mesure la plus récente par point (X, Y), puis moyenne par "champ" (une zone de
  20x9 mm du wafer, pas la coordonnée brute) plutôt que par point individuel - reprend la logique
  de legacy/get_data.py::get_pl_eta.
parameters:
  - wafer_names
postprocessing:
  - pl:apply_pl_kpi
cache_key_column: wafername

raw_columns:
  - name: "PL date"
    description: "Date de la mesure PL brute (avant dédoublonnage - la dernière mesure par point est gardée)."
    example: "2026-01-15"
  - name: "FDL"
    description: "Numéro de demande (lot) associé à la mesure."
    example: "FDL-4821"
  - name: "Wafer name"
    description: "Nom du wafer tel qu'enregistré en base."
    example: "16J5A426MMD4"
  - name: "X"
    description: "Coordonnée X brute du point de mesure sur le wafer (mm), avant reprojection sur un champ."
    example: 12.5
  - name: "Y"
    description: "Coordonnée Y brute du point de mesure sur le wafer (mm), avant reprojection sur un champ."
    example: -4.2
  - name: "Recipe"
    description: "Recette de mesure PL utilisée."
    example: "200mm_MOX_OD1.5_S2E4_v1.recipe"
  - name: "Dominant WL(nm)"
    description: "Longueur d'onde dominante mesurée (nm)."
    example: 451.2
  - name: "Peak WL (nm)"
    description: "Longueur d'onde du pic d'intensité (nm)."
    example: 452.8
  - name: "Integrated PL (a.u.)"
    description: "Intensité PL intégrée sur le spectre (unité arbitraire)."
    example: 1834.6
  - name: "FWHM (nm)"
    description: "Largeur à mi-hauteur du pic PL (nm)."
    example: 18.4

kpi_columns:
  - name: "X"
    description: "Indice de champ (pas la coordonnée brute) - une zone de 20x9 mm du wafer."
    source: "pl:apply_pl_kpi"
    example: 3
  - name: "Y"
    description: "Indice de champ (pas la coordonnée brute), décalé de +1 pour rester positif."
    source: "pl:apply_pl_kpi"
    example: 5
  - name: "wafername"
    description: "Alias de Wafer name, pour rester cohérent avec les autres hooks."
    source: "pl:apply_pl_kpi"
    example: "16J5A426MMD4"
  - name: "Dominant WL(nm)"
    description: "Moyenne, par champ, de la longueur d'onde dominante des points qui y tombent."
    source: "pl:apply_pl_kpi"
    example: 450.9
  - name: "Peak WL (nm)"
    description: "Moyenne, par champ, de la longueur d'onde de pic."
    source: "pl:apply_pl_kpi"
    example: 452.1
  - name: "Integrated PL (a.u.)"
    description: "Moyenne, par champ, de l'intensité PL intégrée."
    source: "pl:apply_pl_kpi"
    example: 1790.3
  - name: "FWHM (nm)"
    description: "Moyenne, par champ, de la largeur à mi-hauteur."
    source: "pl:apply_pl_kpi"
    example: 18.1

representative_column: "Dominant WL(nm)"
example_rows:
  - wafername: "16J5A426MMD4"
    X: 1
    Y: 5
    "Dominant WL(nm)": 449.8
    "Peak WL (nm)": 451.0
    "Integrated PL (a.u.)": 1710.2
    "FWHM (nm)": 17.9
  - wafername: "16J5A426MMD4"
    X: 2
    Y: 5
    "Dominant WL(nm)": 451.4
    "Peak WL (nm)": 452.6
    "Integrated PL (a.u.)": 1822.5
    "FWHM (nm)": 18.3
  - wafername: "16J5A446MMF1"
    X: 1
    Y: 5
    "Dominant WL(nm)": 453.1
    "Peak WL (nm)": 454.0
    "Integrated PL (a.u.)": 1655.8
    "FWHM (nm)": 19.0
