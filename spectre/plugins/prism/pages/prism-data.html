  <!-- spectre:topbar crumb-id="crumb" crumb-text="/ PRISM" -->

  <!-- La gestion de PRISM, réservée aux administrateurs : un menu latéral (comme les Paramètres), une
       section par sujet - aujourd'hui le catalogue des données (hooks), servi par
       /api/characterization (plugin characterization). -->
  <div class="settings-shell">
    <aside class="settings-side" aria-label="Sections de PRISM">
      <div class="settings-side__head">
        <div class="page-eyebrow">Administration</div>
        <div class="settings-side__title">PRISM</div>
      </div>
      <nav class="settings-side__nav" id="prism-nav"></nav>
    </aside>

    <main class="settings-main">
      <div id="denied" class="settings-denied card card-pad" hidden>
        <strong>Réservé aux administrateurs.</strong>
        <p>La gestion de PRISM n'est ouverte qu'aux comptes administrateurs.</p>
      </div>

      <div id="content">
        <p id="breadcrumb" class="prism-breadcrumb"></p>
        <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>
        <div id="app-root"></div>
      </div>
    </main>
  </div>
