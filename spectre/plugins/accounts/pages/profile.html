<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil — Spectre</title>
  <link rel="stylesheet" href="/static/kernel/kernel.css">
  <link rel="stylesheet" href="/static/search/search.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <!-- spectre:topbar -->

  <div class="page" style="max-width:520px;">
    <p style="color:var(--text-faint);margin-bottom:16px;"><a href="/">&larr; Projets</a></p>
    <h1 style="font-size:22px;margin-bottom:20px;">Mon profil</h1>

    <div class="card card-pad" style="margin-bottom:20px;">
      <div class="section-title" style="margin-bottom:14px;">Identité</div>
      <div id="profile-error" class="error" style="display:none;margin-bottom:12px;"></div>
      <div id="profile-success" class="flash flash-ok" style="display:none;margin-bottom:12px;">Nom mis à jour.</div>
      <form id="profile-form" class="field-group">
        <div><label>Nom complet</label><input class="field" id="profile-name" required></div>
        <div><label>Adresse e-mail</label><input class="field" id="profile-email" disabled></div>
        <button class="btn btn-primary" type="submit" style="align-self:flex-start;">Enregistrer</button>
      </form>
    </div>

    <div class="card card-pad">
      <div class="section-title" style="margin-bottom:14px;">Mot de passe</div>
      <div id="password-error" class="error" style="display:none;margin-bottom:12px;"></div>
      <form id="password-form" class="field-group">
        <div><label>Mot de passe actuel</label><input class="field" type="password" id="current-password" required autocomplete="current-password"></div>
        <div><label>Nouveau mot de passe</label><input class="field" type="password" id="new-password" required autocomplete="new-password" minlength="8">
          <div class="help">8 caractères minimum. Vous serez déconnecté(e) de tous vos appareils.</div>
        </div>
        <button class="btn btn-line" type="submit" style="align-self:flex-start;">Changer le mot de passe</button>
      </form>
    </div>
  </div>

  <script src="/static/kernel/api.js"></script>
  <script src="/static/kernel/ui.js"></script>
  <script src="/static/kernel/shell.js"></script>
  <script src="/static/accounts/session.js"></script>
  <script src="/static/search/client.js"></script>
  <script src="/static/search/topbar-search.js"></script>
  <script src="/static/accounts/client.js"></script>
  <script src="/static/accounts/profile.js"></script>
</body>
</html>
