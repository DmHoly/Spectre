<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Présets d'étape — Spectre</title>
  <link rel="stylesheet" href="/static/kernel/kernel.css">
  <link rel="stylesheet" href="/static/search/search.css">
  <link rel="stylesheet" href="/static/structures/structures.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <!-- spectre:topbar crumb-id="crumb" -->

  <div class="page" style="max-width:960px;">
    <p style="color:var(--text-faint);margin-bottom:8px;"><a id="back-link" href="#">&larr; Bibliothèque</a></p>
    <h1 style="font-size:22px;margin-bottom:4px;">Présets d'étape</h1>
    <p style="color:var(--text-soft);font-size:14px;margin-bottom:20px;">Un raccourci nommé vers une recette de dépôt ou de gravure de StructureForge, pour la retrouver en un clic dans le formulaire d'étape du constructeur de structure.</p>

    <div id="error" class="error" style="display:none;margin-bottom:16px;"></div>
    <div id="flash" class="flash flash-ok" style="display:none;margin-bottom:16px;"></div>

    <div class="card card-pad" style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="section-title" id="form-title" style="margin-bottom:0;">Nouveau préset</div>
        <button class="btn btn-line" id="cancel-edit-btn" type="button" style="padding:5px 10px;font-size:12px;display:none;">Annuler</button>
      </div>
      <form id="preset-form" class="field-group">
        <div class="field-row">
          <div><label>Nom</label><input class="field" id="f-name" required></div>
          <div><label>Type</label>
            <select class="field" id="f-kind">
              <option value="deposition">Dépôt</option>
              <option value="etch">Gravure</option>
            </select>
          </div>
        </div>
        <div><label>Recette</label><select class="field" id="f-recipe"></select>
          <div class="help" id="f-recipe-hint" style="margin-top:4px;"></div>
        </div>
        <div><label>Notes (optionnel)</label><input class="field" id="f-notes"></div>
        <div><label>Portée</label>
          <select class="field" id="f-partagee">
            <option value="false">Ce µprojet uniquement</option>
            <option value="true">Partagée avec tous les µprojets</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" id="submit-btn" type="submit">Créer le préset</button>
      </form>
    </div>

    <div class="card card-pad">
      <div class="section-title" style="margin-bottom:12px;">Présets disponibles</div>
      <div id="presets-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
  </div>

  <script src="/static/kernel/api.js"></script>
  <script src="/static/kernel/ui.js"></script>
  <script src="/static/kernel/shell.js"></script>
  <script src="/static/accounts/session.js"></script>
  <script src="/static/search/topbar-search.js"></script>
  <script src="/static/accounts/client.js"></script>
  <script src="/static/microprojects/client.js"></script>
  <script src="/static/wafers/client.js"></script>
  <script src="/static/lots/client.js"></script>
  <script src="/static/structures/client.js"></script>
  <script src="/static/process_library/client.js"></script>
  <script src="/static/process_library/step-presets.js"></script>
</body>
</html>
