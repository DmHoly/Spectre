[project]
name = "spectre"
version = "0.1.0"
description = "Suivi d'expériences : intégration métier de StructureForge (définition de structure) et Follow (suivi/versioning), avec comptes utilisateurs, projets et droits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "structureforge[follow] @ git+https://github.com/dmholy/structureforge.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
spectre = "spectre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["spectre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["spectre"]
