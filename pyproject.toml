[project]
name = "spectre"
version = "0.1.0"
description = "Suivi d'expériences : intégration métier de StructureForge (définition de structure), Follow (suivi/versioning) et PRISM (données de caractérisation), avec comptes utilisateurs, projets et droits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "structureforge[follow] @ git+https://github.com/dmholy/structureforge.git@main",
    # PRISM : le dictionnaire de données de caractérisation (hooks, connexions, cache, KPI).
    # [postgres] amène psycopg2, [charts] le rendu des graphiques de la page /donnees.
    "prism-aledia-datahook[postgres,charts] @ git+https://gitlab-it.aledia.com/sda/tools/soft/prism.git@master",
    # Lumière : le moteur de rapports HTML (blocs Plotly, wafer maps, suivi de plaques) - plugin « lumiere ».
    # Il déclare PRISM par la même URL que ci-dessus : une seule installation de PRISM, partagée.
    "lumiere-report-engine @ git+https://gitlab-it.aledia.com/sda/analysis/report/lumiere_report_engine.git",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
spectre = "spectre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["spectre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: un test de plus de dix secondes (la démo, lancée en sous-processus) - `pytest -m 'not slow'` pour une passe rapide"]

[tool.coverage.run]
source = ["spectre"]
